include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Doc comments are required on public classes, not on every member.
    public_member_api_docs: false
    # Single-package app: relative imports inside lib/ are clearer.
    always_use_package_imports: false
    prefer_relative_imports: true
    # Keep the classic `ClassName(...)` constructor syntax, which more
    # readers are familiar with than the Dart 3.13 shorthand.
    unnecessary_type_name_in_constructor: false
    unnecessary_const_in_enum_constructor: false
    # Suggests Dart 3.12 private named parameters (`{required this._x}`);
    # explicit initializer lists are clearer to most readers today.
    prefer_initializing_formals: false
