name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Generate code (drift)
        run: dart run build_runner build
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build-apk:
    name: Build release APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the APK to GitHub Releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      # Keys come from repository secrets and never touch the repo. Without
      # them the APK still builds and shows a "configuration missing" screen.
      - name: Create .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "MAPS_API_KEY=$MAPS_API_KEY"
          } > .env

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Rename APK
        # Branch names may contain "/" (feature/x), which is not file-safe.
        run: |
          name="${GITHUB_REF_NAME//\//-}"
          mv build/app/outputs/flutter-apk/app-release.apk "pulseroute-$name.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulseroute-apk
          path: pulseroute-*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pulseroute-*.apk
          generate_release_notes: true
