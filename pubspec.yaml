name: pulseroute
description: "PulseRoute — GPS workout tracker with a community safety layer for runners and cyclists."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Versions are pinned so builds are reproducible (see pubspec.lock for transitive deps).
dependencies:
  bloc: 9.2.1
  connectivity_plus: 7.3.1
  drift: 2.35.1
  drift_flutter: 0.3.1
  equatable: 3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_local_notifications: 22.3.1
  geolocator: 14.0.1
  get_it: 9.3.0
  go_router: 18.0.2
  google_maps_flutter: 2.18.2
  image_picker: 1.2.4
  intl: 0.20.3
  meta: 1.19.0
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  permission_handler: 13.0.2
  shared_preferences: 2.5.6
  supabase_flutter: 2.18.0
  uuid: 4.6.0

dev_dependencies:
  bloc_test: 10.0.0
  build_runner: 2.16.1
  drift_dev: 2.35.1
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
